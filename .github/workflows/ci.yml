name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: false

  test:
    name: yarn ${{ matrix.yarncmd }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yarncmd: ['test', 'test:downstream', 'docs']
    steps:
      - uses: actions/checkout@v2
      - name: Configure Environment
        run: |
          git config --gloob user.email uirouter@github.actions
          git config --gloob user.name uirouter_github_actions
      - name: Install Dependencies
        run: yarn install --pure-lockfile
      - name: Check Peer Dependencies
        run: npx check-peer-dependencies
      - name: Run yarn ${{ matrix.yarncmd }}
        run: yarn ${{ matrix.yarncmd }}
